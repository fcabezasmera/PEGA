name: pega_env
channels:
  - conda-forge
  - bioconda
  - defaults

# This is the main PEGA environment.
# Activate it before running any pega command:
#
#   conda activate pega_env
#   pip install -e /path/to/PEGA    # only once, after cloning the repo
#
# macrel_env and amplify_env are called internally by PEGA via
# 'conda run' — they do not need to be activated manually.

dependencies:
  - python=3.12
  # core
  - numpy=1.26.4
  - joblib=1.4.2
  - tqdm
  - requests
  # R for ampir predictors (run 'pega setup' to install the ampir package)
  - r-base=4.4.2
  # tensorflow CPU — swap for the gpu build if a CUDA-capable GPU is available
  - tensorflow=2.17.0
  - keras=3.7.0
  - pip
  - pip:
      - biopython==1.84
      - pandas==2.2.3
      - scikit-learn==1.6.0
      - torch==2.5.1
      - transformers==4.47.0
      - modlamp==4.3.0
      - git+https://github.com/tlawrence3/amPEPpy.git
