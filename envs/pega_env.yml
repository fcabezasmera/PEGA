name: pega_env
channels:
  - conda-forge
  - bioconda
  - defaults

# Main PEGA environment — tested on Python 3.10.
#
# After creating the environment:
#   conda activate pega_env
#   pip install -e /path/to/PEGA
#
# Then run the post-install steps in the README (ampir, amPEPpy, modlAMP).

dependencies:
  - python=3.10          # pin to 3.10 — required for TF 2.17 + modlAMP compatibility
  - numpy=1.26.4
  - joblib>=1.3
  - tqdm
  - requests
  # R for ampir predictors
  - r-base=4.4
  - r-rlang>=1.1.7       # ampir requires >=1.1.7; pin here avoids post-install conflict
  # TensorFlow CPU — swap tensorflow for tensorflow-gpu if CUDA is available
  - tensorflow=2.17.0
  - keras=3.7.0
  - pip
  - pip:
      - biopython>=1.81
      - pandas>=2.0
      - scikit-learn>=1.3
      - torch==2.5.1
      - transformers>=4.35
      # modlAMP and amPEPpy must be installed AFTER env creation (see README)
      # Do NOT add them here — modlAMP==4.3.0 has a broken mysql dependency
      # and amPEPpy requires git+... which may fail in some network configurations
